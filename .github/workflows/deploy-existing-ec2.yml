name: Build and deploy existing EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: existing-ec2-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Linux server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    outputs:
      revision: ${{ steps.package.outputs.revision }}
      server_hash: ${{ steps.package.outputs.server_hash }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep unzip
          rg --version
      - name: Install pinned engine and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-download"
          cd "$RUNNER_TEMP/godot-download"
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          engine=Godot_v4.7.2-stable_linux.x86_64.zip
          templates=Godot_v4.7.2-stable_export_templates.tpz
          for file in "$engine" "$templates" SHA512-SUMS.txt; do
            curl -fL --retry 3 "$base/$file" -o "$file"
          done
          for file in "$engine" "$templates"; do
            awk -v file="$file" '$2 == file {print}' SHA512-SUMS.txt > selected.sha512
            test -s selected.sha512
            sha512sum -c selected.sha512
          done
          unzip -q "$engine"
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ln -s "$PWD/Godot_v4.7.2-stable_linux.x86_64" "$PWD/godot"
          echo "$PWD" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j "$templates" templates/version.txt \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Source regression and admission checks
        shell: bash
        env:
          # Temporary playtest scope: retain full default matrix for later scale work.
          PLAYER_COUNTS: '4'
        run: |
          set -euo pipefail
          GODOT_BIN=$(command -v godot)
          export GODOT_BIN PYTHONDONTWRITEBYTECODE=1
          godot --headless --editor --path . --quit
          tests/run_ui_regression.sh
          python3 -m unittest discover -s tests -p test_room_service.py -v
      - name: Export twice and verify standalone Linux lifecycle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tools/export_playtest.sh linux-server .scratch/ci-linux-a
          tools/export_playtest.sh linux-server .scratch/ci-linux-b
          diff .scratch/ci-linux-{a,b}/SHA256SUMS.txt
          python3 tests/run_release_linux_test.py .scratch/ci-linux-a --log .scratch/ci-linux-lifecycle.log
          mkdir -p .scratch/release
          revision=$(git rev-parse HEAD)
          tar -czf .scratch/release/DisasterParty-Linux.tar.gz -C .scratch/ci-linux-a \
            DisasterParty.x86_64 DisasterParty.pck room_service.py BUILD.txt SHA256SUMS.txt
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "server_hash=$(sha256sum .scratch/release/DisasterParty-Linux.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: linux-server
          path: .scratch/release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to existing Tokyo EC2 through SSM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    # Intentionally no GitHub Environment: OIDC sub remains repo:...:ref:refs/heads/main.
    env:
      AWS_REGION: ap-northeast-1
      INSTANCE_ID: i-0fd134761df1f88bf
      REVISION: ${{ needs.build.outputs.revision }}
      SERVER_HASH: ${{ needs.build.outputs.server_hash }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: disaster-party-main-deploy
      - name: Send verified deployment script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 665808487768
          # A short-lived signed artifact URL, never a GitHub token, reaches EC2.
          curl -fsS -D artifact-headers -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          ARTIFACT_URL=$(sed -n 's/^[Ll]ocation: //p' artifact-headers | tr -d '\r')
          test -n "$ARTIFACT_URL"
          echo "::add-mask::$ARTIFACT_URL"
          export ARTIFACT_URL
          python3 - <<'PY'
          import json, os, shlex
          from pathlib import Path
          script = Path('tools/deploy_existing_ec2.sh').read_text()
          args = ' '.join(shlex.quote(os.environ[key]) for key in ('REVISION', 'SERVER_HASH', 'ARTIFACT_URL'))
          command = "bash -s -- " + args + " <<'DEPLOY_SCRIPT'\n" + script + "\nDEPLOY_SCRIPT\n"
          Path('ssm-parameters.json').write_text(json.dumps({'commands': [command], 'executionTimeout': ['600']}))
          PY
          command_id=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file://ssm-parameters.json \
            --timeout-seconds 120 --query Command.CommandId --output text)
          # Avoid the CLI waiter's shorter default polling window and SSM eventual-consistency race.
          status=Pending
          for _ in $(seq 1 120); do
            if aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --output json > invocation.json 2> invocation-error.txt; then
              status=$(python3 -c 'import json; print(json.load(open("invocation.json"))["Status"])')
              case "$status" in
                Success) cat invocation.json; exit 0 ;;
                Pending|InProgress|Delayed) ;;
                *) cat invocation.json; exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist invocation-error.txt; then
              cat invocation-error.txt >&2
              exit 1
            fi
            sleep 5
          done
          echo "Deployment status polling timed out; command $command_id may still run. Inspect SSM before retrying." >&2
          exit 1
