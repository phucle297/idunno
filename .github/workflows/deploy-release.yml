name: Deploy + Release (manual)

# Manual only: one "Run workflow" click on main builds Linux + Windows from the
# selected main commit, deploys the Linux server to the existing Tokyo EC2 via
# OIDC/SSM (unchanged flow), then publishes a tagged GitHub (pre-)release.
# There is intentionally no push trigger (T13).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = playtest-<ICT date>-<sha7>, the existing convention)
        type: string
        required: false
        default: ""
      title:
        description: Release title (empty = "Disaster Party — Playtest <tag>")
        type: string
        required: false
        default: ""
      notes:
        description: Optional text placed above the auto-generated release notes
        type: string
        required: false
        default: ""
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: existing-ec2-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux server + Windows client
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # OIDC trust is pinned to repo:...:ref:refs/heads/main; refuse other refs early.
    if: github.ref == 'refs/heads/main'
    outputs:
      revision: ${{ steps.package.outputs.revision }}
      server_hash: ${{ steps.package.outputs.server_hash }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and check release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="playtest-$(TZ=Asia/Saigon date +%F)-$(git rev-parse --short=7 HEAD)"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "::error::Invalid tag '$tag' (allowed: letters, digits, . _ -)"; exit 1
          fi
          # Fail before deploying if the tag/release already exists.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::error::Tag $tag already exists; pass a new tag."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        shell: bash
        run: command -v rg || { sudo apt-get update -q && sudo apt-get install -y -q ripgrep; }
      - uses: ./.github/actions/setup-godot
        with:
          version: 4.7.2
          templates: linux_release.x86_64 linux_debug.x86_64 windows_release_x86_64.exe windows_debug_x86_64.exe
      - name: Export and package Linux server + Windows client
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tools/export_playtest.sh linux-server .scratch/ci-linux-a
          tools/export_playtest.sh windows .scratch/ci-windows
          revision=$(git rev-parse HEAD)
          short=$(git rev-parse --short=7 HEAD)
          mkdir -p .scratch/release .scratch/windows
          tar -czf .scratch/release/DisasterParty-Linux.tar.gz -C .scratch/ci-linux-a \
            DisasterParty.x86_64 DisasterParty.pck room_service.py cosmetic_catalog.json BUILD.txt SHA256SUMS.txt
          (cd .scratch/ci-windows && zip -q -X "$GITHUB_WORKSPACE/.scratch/windows/DisasterParty-Windows-Internet-$short.zip" \
            DisasterParty.exe DisasterParty.pck BUILD.txt SHA256SUMS.txt)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "server_hash=$(sha256sum .scratch/release/DisasterParty-Linux.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: linux-server
          path: .scratch/release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: .scratch/windows/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to existing Tokyo EC2 through SSM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    # Intentionally no GitHub Environment: OIDC sub remains repo:...:ref:refs/heads/main.
    env:
      AWS_REGION: ap-northeast-1
      INSTANCE_ID: i-0fd134761df1f88bf
      REVISION: ${{ needs.build.outputs.revision }}
      SERVER_HASH: ${{ needs.build.outputs.server_hash }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: disaster-party-main-deploy
      - name: Send verified deployment script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 665808487768
          # A short-lived signed artifact URL, never a GitHub token, reaches EC2.
          curl -fsS -D artifact-headers -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          ARTIFACT_URL=$(sed -n 's/^[Ll]ocation: //p' artifact-headers | tr -d '\r')
          test -n "$ARTIFACT_URL"
          echo "::add-mask::$ARTIFACT_URL"
          export ARTIFACT_URL
          python3 - <<'PY'
          import json, os, shlex
          from pathlib import Path
          script = Path('tools/deploy_existing_ec2.sh').read_text()
          args = ' '.join(shlex.quote(os.environ[key]) for key in ('REVISION', 'SERVER_HASH', 'ARTIFACT_URL'))
          command = "bash -s -- " + args + " <<'DEPLOY_SCRIPT'\n" + script + "\nDEPLOY_SCRIPT\n"
          Path('ssm-parameters.json').write_text(json.dumps({'commands': [command], 'executionTimeout': ['600']}))
          PY
          command_id=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file://ssm-parameters.json \
            --timeout-seconds 120 --query Command.CommandId --output text)
          # Avoid the CLI waiter's shorter default polling window and SSM eventual-consistency race.
          status=Pending
          for _ in $(seq 1 120); do
            if aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --output json > invocation.json 2> invocation-error.txt; then
              status=$(python3 -c 'import json; print(json.load(open("invocation.json"))["Status"])')
              case "$status" in
                Success) cat invocation.json; exit 0 ;;
                Pending|InProgress|Delayed) ;;
                *) cat invocation.json; exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist invocation-error.txt; then
              cat invocation-error.txt >&2
              exit 1
            fi
            sleep 5
          done
          echo "Deployment status polling timed out; command $command_id may still run. Inspect SSM before retrying." >&2
          exit 1

  release:
    name: Publish GitHub release
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      REVISION: ${{ needs.build.outputs.revision }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_NOTES: ${{ inputs.notes }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create tag + release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd assets
          sha256sum DisasterParty-Linux.tar.gz DisasterParty-Windows-Internet-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          title="${INPUT_TITLE:-Disaster Party — Playtest $TAG}"
          footer="Deployed to the Tokyo server by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID from $REVISION. Download the Windows ZIP, extract everything and keep the EXE and PCK together; older clients are incompatible. Unsigned prototype."
          if [[ -n "$INPUT_NOTES" ]]; then notes=$(printf '%s\n\n%s' "$INPUT_NOTES" "$footer"); else notes="$footer"; fi
          args=(--repo "$GITHUB_REPOSITORY" --target "$REVISION" --title "$title" --notes "$notes" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" \
            DisasterParty-Linux.tar.gz DisasterParty-Windows-Internet-*.zip SHA256SUMS.txt
          echo "### Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
