name: Setup pinned Godot
description: Download (cached) and SHA512-verify the pinned Godot engine, optionally with export templates.
inputs:
  version:
    description: Godot release, e.g. 4.7.2
    default: 4.7.2
  templates:
    description: Space-separated export template file names to install (empty = none)
    default: ""
runs:
  using: composite
  steps:
    - name: Restore Godot download cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/godot-ci/${{ inputs.version }}
        # Release archives are immutable; templates list is part of the key.
        key: godot-${{ runner.os }}-${{ inputs.version }}-${{ inputs.templates != '' && 'tpl' || 'engine' }}-v1
    - name: Download and verify
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
        GODOT_TEMPLATES: ${{ inputs.templates }}
      run: |
        set -euo pipefail
        dir="$HOME/.cache/godot-ci/$GODOT_VERSION"
        mkdir -p "$dir"
        cd "$dir"
        base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
        engine="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
        files=("$engine")
        if [[ -n "$GODOT_TEMPLATES" ]]; then files+=("$templates"); fi
        test -s SHA512-SUMS.txt || curl -fsSL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
        for file in "${files[@]}"; do
          test -s "$file" || curl -fsSL --retry 3 "$base/$file" -o "$file"
          awk -v file="$file" '$2 == file {print}' SHA512-SUMS.txt > selected.sha512
          test -s selected.sha512
          sha512sum -c selected.sha512
        done
        bin="$RUNNER_TEMP/godot-bin"
        mkdir -p "$bin"
        unzip -oq "$engine" -d "$bin"
        chmod +x "$bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
        ln -sf "$bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$bin/godot"
        echo "$bin" >> "$GITHUB_PATH"
        echo "GODOT_BIN=$bin/godot" >> "$GITHUB_ENV"
        if [[ -n "$GODOT_TEMPLATES" ]]; then
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          read -r -a wanted <<< "$GODOT_TEMPLATES"
          unzip -oj "$templates" templates/version.txt "${wanted[@]/#/templates/}" -d "$tdir"
        fi
        "$bin/godot" --version
